name: Java CI template

on:
  workflow_call:
    inputs:
      java-version:
        required: true
        type: string
      run-tests:
        required: false
        type: boolean
        default: true
      build-artifact:
        required: false
        type: boolean
        default: true
      project-path:
        required: false
        type: string
        default: '.'

jobs:
  build-test-install:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Compile project
        run: mvn -B compile
        working-directory: ${{ inputs.project-path }}

      - name: Run tests
        if: ${{ inputs.run-tests }}
        run: mvn -B test
        working-directory: ${{ inputs.project-path }}

      - name: Build artifact
        if: ${{ inputs.build-artifact }}
        run: mvn -B package -DskipTests
        working-directory: ${{ inputs.project-path }}

